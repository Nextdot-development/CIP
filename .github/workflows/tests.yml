name: tests

# The whole suite against PostgreSQL with pgvector. On a laptop the tests run on
# an embedded PostgreSQL that has no pgvector, so the embeddings and semantic
# search tests skip there; here they run for real.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Route types, so the typecheck knows every page without a full build.
      - run: npx next typegen
      - run: npx tsc --noEmit -p .
      - run: npm run lint
      - run: npm test
